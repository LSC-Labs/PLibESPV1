; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
; default_envs = d1_mini
; default_envs = az-delivery-devkit-v4
; default_envs = d1_mini , az-delivery-devkit-v4
default_envs = d1_mini_debug

; ********************************************************************
; default section for all environments
; override in specific sections
; - Framework is Arduino
; - Upload and monitor speed
; 
; Tests:
; - Tests are set to an undefined directory, so not tests active
; - Using googletest as test library.
; To use the test functions, include google library and 
; Set the test_filter and test_ignore to the desired area and tests
; *******************************************************************
[env]
;	framework       = arduino
	upload_speed    = 460800
	monitor_speed   = 115200
	test_framework 	= ${test.framework}
	test_filter     = no_tests


; *******************************************************************
; Test Framework (google)
; To implement the tests in your device environment:
; - set "test_filter = ${test.filter_embedded}"
; - enhance "lib_deps = ${test.lib_deps} ...."
; *******************************************************************
[test]
	framework  		= googletest
	lib_deps		= google/googletest@^1.17.0
	filter_embedded	= embedded/*
	filter_native	= native/*


; container for common settings
[common]
	framework       = arduino
	upload_speed    = 460800
	monitor_speed   = 115200

    ; Common build flags for all environments
	build_flags =
		-D TEMPLATE_PLACEHOLDER=36              ; $ sign for web templates instead of %
		'-D WIFI_DEFAULT_AP_SSID_PREFIX="LSC"'	; Default WIFI AP SSID Prefix
		'-D DEFAULT_DEVICE_NAME="LSC-Device"'   ; Default Device Name
		; Allow to use #pragma directives in source code and enable exception handling
		; in previous versions it was enabled by -fexceptions flag
		-Wno-unknown-pragmas
		-D PIO_FRAMEWORK_ARDUINO_ENABLE_EXCEPTIONS
		; WiFi PHY mode default (n/g/b) - can be changed in the config ("wifi.phymode"),
		; i.e. 802.11g reduces SDK rate table changes on ESP8266:
		;   '-D WIFI_DEFAULT_PHY_MODE="g"'
		; ESP8266 NONOS SDK: default of the core (2.2.x). Newer SDK, if needed:
		;   -D PIO_FRAMEWORK_ARDUINO_ESPRESSIF_SDK305

	board_build.ldscript = eagle.flash.4m1m.ld

	; Common library dependencies for all environments
	lib_deps =
		; JSON: the library uses JsonNode - ArduinoJson is not needed.
		; To use the ArduinoJson backend of JsonHelper.h add
		;   bblanchon/ArduinoJson   here and   -D LSC_JSON_USE_ARDUINOJSON   to build_flags
		; Decide wich library for sensors is useful... currently ADAFruit
		https://github.com/adafruit/DHT-sensor-library

		; Versions are pinned - tested combination:
		;   ESPAsyncTCP 2.0.0        - scripts/patchLibs.py patches this version (abort use-after-free)
		;   ESPAsyncWebServer 3.10.0 - contains the WebSocket defragmentation fix (406147f, issue #382)
		;                              3.12.x makes the request constructor private (used in CWebServer.cpp)
		; Framework libraries (LittleFS, ESP8266WiFi, WiFi, ...) are found by the
		; library dependency finder from the includes - no entry needed.
		ESP32Async/ESPAsyncTCP @ 2.0.0
		ESP32Async/ESPAsyncWebServer @ 3.10.0
		marvinroger/AsyncMqttClient @ 0.9.0
		adafruit/Adafruit SH110X@^2.1.14
		adafruit/Adafruit GFX Library@^1.12.1



	; The extra scripts to be run during the build process

	; patchLibs.py (pre): fixes bugs in downloaded libraries (ESPAsyncTCP abort use-after-free)
	extra_scripts =
		pre:scripts/patchLibs.py
		scripts/buildSteps.py

	board_build.filesystem = littlefs


[common_esp8266]
	; Context of ESP8266 Devices...
	; Released ESP8266 Arduino core 3.1.2 (PlatformIO package version 3.30102.0).
	; The git master (3.2.0-dev) crashed in lwIP (pbuf_free in ip4_input).
	; Development version, if needed:
	;   platformio/framework-arduinoespressif8266 @ https://github.com/esp8266/Arduino.git
	platform_packages =
		platformio/framework-arduinoespressif8266 @ 3.30102.0


[common_esp32]
	; Context of ESP32 Devices

[env:native]
	; *************************************************************
	; * Native development / test version....
	; *************************************************************
    platform 	= native
    test_ignore = test_embedded
    build_flags = -std=c++17
                -Wno-unknown-pragmas
                -D NATIVE_RUNTIME

	test_filter		= ${test.filter_native}
    lib_compat_mode = off
    lib_deps =  google/googletest@^1.17.0

[env:native_arduinojson]
	; *************************************************************
	; * Native tests with the ArduinoJson backend of JsonHelper.h
	; *************************************************************
    extends     = env:native
    build_flags = ${env:native.build_flags}
                -D LSC_JSON_USE_ARDUINOJSON
    lib_deps    = ${env:native.lib_deps}
                bblanchon/ArduinoJson@^7.4.3

[env:d1_mini]
	; https://docs.platformio.org/en/latest/platforms/espressif8266.html
	; https://docs.platformio.org/en/stable/boards/espressif8266/d1_mini.html
	board       	= d1_mini
	platform    	= espressif8266
	framework		= ${common.framework}

	build_type  	= release
	extra_scripts	= ${common.extra_scripts}

	platform_packages		= ${common_esp8266.platform_packages}
	board_build.ldscript	= ${common.board_build.ldscript}

	board_build.filesystem	= ${common.board_build.filesystem}

	build_flags =
		${common.build_flags}
		-Wno-unused-value

	; Only use libraries compatible with ESP8266 (excludes ESP32 AsyncTCP)
	lib_compat_mode = strict
	lib_ldf_mode = chain

	lib_deps =
		${common.lib_deps}


; *************************************************************
; Debug and Test version....
; *************************************************************
[env:d1_mini_debug]
    ; https://docs.platformio.org/en/latest/platforms/espressif8266.html
    ; https://docs.platformio.org/en/stable/boards/espressif8266/d1_mini.html
	platform 		= espressif8266
	board 			= d1_mini
	framework		= ${common.framework}

	build_type  	= debug
	extra_scripts 	= ${common.extra_scripts}
	test_filter		= ${test.filter_embedded}
	; Embedded tests: build the library sources (src/) with the test runner -
	; no manual includeModules.h lists (they ran out of date)
	test_build_src	= yes

	platform_packages 		= ${common_esp8266.platform_packages}
	board_build.ldscript 	= ${common.board_build.ldscript}
	monitor_filters 		= esp8266_exception_decoder        ; Enable stack trace decoding

	board_build.filesystem 	= ${common.board_build.filesystem}

	; Build flags specific to this environment
	; Enable various debug options by removing the leading "NO_" for the sections you want to debug
	build_flags = 	
		${common.build_flags}
		-D TRACE
		-D DEBUGVERSION					; Defines, that this is a debugversion
		-D DEBUGINFOS					; Main Debug Info to enable Debug Macros
		-D NO_DEBUG_LSC_FILESYSTEM
		-D NO_DEBUG_LSC_SECURITY
		-D NO_DEBUG_LSC_APPL
		-D NO_DEBUG_LSC_STATUSHANDLER
		-D NO_DEBUG_LSC_CONFIGHANDLER
		-D NO_DEBUG_LSC_WIFI
		-D NO_DEBUG_LSC_HTLM_PAGES
		-D NO_DEBUG_LSC_BUTTON
		-D NO_DEBUG_LSC_WEBSERVER
		-D NO_DEBUG_LSC_WEBROUTES
		-D NO_DEBUG_LSC_WEBSOCKET
		-D NO_DEBUG_LSC_MQTT
		-D NO_DEBUG_LSC_RF433RECEIVER
		-D NO_DEBUG_LSC_DHT_SENSOR
		-D NO_DEBUG_LSC_DISPLAY
		-D NO_DEBUG_LSC_FRONTEND			; Debug the Frontend (WebGUI) - use the Web Developer Tools in the Browser
            
	lib_compat_mode = strict
	lib_ldf_mode = chain
	
	; Add debug or board specific libraries here
	lib_deps = 
		${test.lib_deps}
		${common.lib_deps}



[env:az-devkit-v4_debug]
	platform  	= espressif32
	board     	= az-delivery-devkit-v4
	framework	= ${common.framework}

	build_type  = debug
	test_filter		= ${test.filter_embedded}
	; Embedded tests: build the library sources (src/) with the test runner
	test_build_src	= yes
	; googletest >= 1.13 needs C++17 - Arduino-ESP32 2.x defaults to gnu++11
	build_unflags	= -std=gnu++11
	; Shared flags (same defaults as the ESP8266 environments) + C++17
	build_flags		=
		${common.build_flags}
		-std=gnu++17

	monitor_filters = esp32_exception_decoder        ; Enable stack trace decoding
        
	lib_compat_mode = strict
	lib_ldf_mode = chain
	
	; Add debug or board specific libraries here
	lib_deps = 
		${common.lib_deps}
		
        


